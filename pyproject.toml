[project]
name = "bertfolio"
version = "0.1.0"
description = "Local earnings transcript analyzer for Bertfolio"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "python-multipart>=0.0.9",
  "requests>=2.32.0",
  "httpx>=0.28.0",
  "beautifulsoup4>=4.12.3",
  "python-dotenv>=1.0.1",
  "transformers>=4.50.0",
  "torch>=2.6.0",
  "yfinance>=0.2.54",
  "pandas>=2.2.3",
  "numpy>=2.2.4",
  "urllib3<2"
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
